<!DOCTYPE html>
<!-- @dsCard group="Components" name="Components — FAB" subtitle="Momentum green floating action — fixed bottom-right" viewport="700x110" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Amendment specimen</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<!-- chrome comes from _card.css -->
</head>
<body>
<div class="card">
  <div style="display:flex; gap: 24px; align-items: center;">
    <button style="background: var(--color-action); color: var(--color-action-label); width: 56px; height: 56px; border: 0; border-radius: 14px; cursor: pointer; box-shadow: 0 20px 25px -5px rgb(15 23 42 / 0.25), 0 8px 10px -6px rgb(15 23 42 / 0.25); display: flex; align-items: center; justify-content: center; font-family: var(--font-sans); font-weight: var(--sans-semibold); font-size: 24px;">+</button>
    <div>
      <div style="font-family: var(--font-serif); font-variation-settings: var(--serif-display); font-weight: 700; font-size: 15px; color: var(--text-primary);">Momentum-green floating action button</div>
      <div style="font-family: var(--font-serif); font-variation-settings: 'opsz' 16, 'wght' 420; font-size: 13px; color: var(--text-secondary); margin-top: 4px;">Fixed bottom-right where the primary action is ambiguous.</div>
    </div>
  </div>
</div>
</body>
</html>
