<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing — Shadow tiers" subtitle="flat / whisper / raised / floating / chrome" viewport="700x180" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Amendment specimen</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<!-- chrome comes from _card.css -->
</head>
<body>
<div class="card">
  <div style="display:flex; gap: 18px; padding: 12px 6px;">
    
      <div style="display:flex; flex-direction:column; gap:8px; align-items:center;">
        <div style="background: white; width: 70px; height: 50px; border-radius: 6px; box-shadow: none; box-sizing: border-box;"></div>
        <span class="lbl">flat</span>
        <span style="font-family: var(--font-serif); font-variation-settings: 'opsz' 16, 'wght' 420; font-size: 12px; color: var(--text-tertiary); white-space: nowrap;">rest button, stat plates</span>
      </div>
    
      <div style="display:flex; flex-direction:column; gap:8px; align-items:center;">
        <div style="background: white; width: 70px; height: 50px; border-radius: 6px; box-shadow: 0 1px 2px 0 rgb(15 23 42 / 0.04), 0 1px 1px -1px rgb(15 23 42 / 0.04); box-sizing: border-box;"></div>
        <span class="lbl">whisper</span>
        <span style="font-family: var(--font-serif); font-variation-settings: 'opsz' 16, 'wght' 420; font-size: 12px; color: var(--text-tertiary); white-space: nowrap;">ghost hover</span>
      </div>
    
      <div style="display:flex; flex-direction:column; gap:8px; align-items:center;">
        <div style="background: white; width: 70px; height: 50px; border-radius: 6px; box-shadow: 0 4px 6px -1px rgb(15 23 42 / 0.12), 0 2px 4px -2px rgb(15 23 42 / 0.12); box-sizing: border-box;"></div>
        <span class="lbl">raised</span>
        <span style="font-family: var(--font-serif); font-variation-settings: 'opsz' 16, 'wght' 420; font-size: 12px; color: var(--text-tertiary); white-space: nowrap;">cards</span>
      </div>
    
      <div style="display:flex; flex-direction:column; gap:8px; align-items:center;">
        <div style="background: white; width: 70px; height: 50px; border-radius: 6px; box-shadow: 0 20px 25px -5px rgb(15 23 42 / 0.18), 0 8px 10px -6px rgb(15 23 42 / 0.18); box-sizing: border-box;"></div>
        <span class="lbl">floating</span>
        <span style="font-family: var(--font-serif); font-variation-settings: 'opsz' 16, 'wght' 420; font-size: 12px; color: var(--text-tertiary); white-space: nowrap;">modal, FAB</span>
      </div>
    
      <div style="display:flex; flex-direction:column; gap:8px; align-items:center;">
        <div style="background: white; width: 70px; height: 50px; border-radius: 6px; box-shadow: 0 8px 16px -4px rgb(15 23 42 / 0.12), 0 3px 6px -3px rgb(15 23 42 / 0.12); box-sizing: border-box;"></div>
        <span class="lbl">chrome</span>
        <span style="font-family: var(--font-serif); font-variation-settings: 'opsz' 16, 'wght' 420; font-size: 12px; color: var(--text-tertiary); white-space: nowrap;">navbar</span>
      </div>
    
  </div>
</div>
</body>
</html>
