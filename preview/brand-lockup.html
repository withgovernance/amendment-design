<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Brand — Lockup" subtitle="Mark + wordmark — horizontal and stacked" viewport="700x356" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brand — Lockup</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>.card { padding:30px; display:flex; align-items:center; gap:56px; }
.wm{font-family:var(--font-sans);font-variation-settings:var(--sans-chrome);font-weight:var(--sans-medium);text-transform:uppercase;color:var(--color-primary-dark);line-height:1}
.wm .dot{color:var(--color-action)}
.horiz{display:flex;align-items:center;gap:14px}
.horiz img{width:46px;height:46px}
.horiz .wm{font-size:30px;letter-spacing:.05em}
.stack{display:flex;flex-direction:column;align-items:center;gap:12px}
.stack img{width:60px;height:60px}
.stack .wm{font-size:20px;letter-spacing:.11em}
.note{font-family:var(--font-serif);font-variation-settings:'opsz' 16,'wght' 420;font-size:12.5px;color:var(--text-secondary);max-width:190px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <div class="horiz"><img src="../assets/mark.svg" alt=""><div class="wm">Amendment<span class="dot">.</span></div></div>
  <div class="stack"><img src="../assets/mark.svg" alt=""><div class="wm">Amendment<span class="dot">.</span></div></div>
  <div class="note">Clear space equals the mark's ring width on all sides. Wordmark cap-height aligns to the mark's inner field — never to its outer ring.</div>
</div>
</body>
</html>
