<!DOCTYPE html>
<!-- @dsCard group="Components" name="Components — Buttons" subtitle="default / cta / secondary / ghost / icon" viewport="700x121" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Amendment specimen</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>.card { padding: 20px 22px; }
/* Below 780px the two rows dissolve into one grid so each label sits under the button it names. */
@media (max-width: 780px) {
  .card { display: grid; grid-template-columns: repeat(2, max-content); column-gap: var(--space-4); row-gap: var(--space-2); align-items: center; justify-items: start; }
  .btn-row, .lbl-row { display: contents !important; }
  .lbl-row .lbl { margin-bottom: var(--space-3); }
  .btn-row > :nth-child(1) { grid-area: 1 / 1; } .lbl-row > :nth-child(1) { grid-area: 2 / 1; }
  .btn-row > :nth-child(2) { grid-area: 1 / 2; } .lbl-row > :nth-child(2) { grid-area: 2 / 2; }
  .btn-row > :nth-child(3) { grid-area: 3 / 1; } .lbl-row > :nth-child(3) { grid-area: 4 / 1; }
  .btn-row > :nth-child(4) { grid-area: 3 / 2; } .lbl-row > :nth-child(4) { grid-area: 4 / 2; }
  .btn-row > :nth-child(5) { grid-area: 5 / 1; } .lbl-row > :nth-child(5) { grid-area: 6 / 1; }
}
  
</style>
</head>
<body>
<div class="card">
  <div class="btn-row" style="display:flex; flex-wrap: wrap; gap: 10px; align-items: center;">
    <button style="font-family: var(--font-sans); font-weight: var(--sans-semibold); font-size: 14px; padding: 9px 16px; border-radius: 8px; border: 0; cursor: pointer; transition: background 200ms cubic-bezier(0.4,0,0.2,1), box-shadow 200ms cubic-bezier(0.4,0,0.2,1); background: linear-gradient(to bottom, #334155, #1e293b); color: white; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 10%);">Default</button>
    <button style="font-family: var(--font-sans); font-weight: var(--sans-semibold); font-size: 14px; padding: 9px 16px; border-radius: 8px; border: 0; cursor: pointer; transition: background 200ms cubic-bezier(0.4,0,0.2,1), box-shadow 200ms cubic-bezier(0.4,0,0.2,1); background: var(--color-action); color: var(--color-action-label);">Send the letter</button>
    <button style="font-family: var(--font-sans); font-weight: var(--sans-semibold); font-size: 14px; padding: 9px 16px; border-radius: 8px; border: 0; cursor: pointer; transition: background 200ms cubic-bezier(0.4,0,0.2,1), box-shadow 200ms cubic-bezier(0.4,0,0.2,1); background: rgb(255 255 255 / 85%); backdrop-filter: blur(50px); color: var(--text-primary); box-shadow: inset 0 0 0 1px rgb(0 0 0 / 10%);">Secondary</button>
    <button style="font-family: var(--font-sans); font-weight: var(--sans-semibold); font-size: 14px; padding: 9px 16px; border-radius: 8px; border: 0; cursor: pointer; transition: background 200ms cubic-bezier(0.4,0,0.2,1), box-shadow 200ms cubic-bezier(0.4,0,0.2,1); background: rgb(255 255 255 / 10%); color: var(--text-secondary); border-radius: 12px; backdrop-filter: blur(50px); box-shadow: inset 0 0 0 1px rgb(0 0 0 / 5%);">Sample question</button>
    <button style="font-family: var(--font-sans); font-weight: var(--sans-semibold); font-size: 14px; padding: 9px 16px; border-radius: 8px; border: 0; cursor: pointer; transition: background 200ms cubic-bezier(0.4,0,0.2,1), box-shadow 200ms cubic-bezier(0.4,0,0.2,1); background: transparent; color: var(--text-primary); padding: 9px; border-radius: 12px; width: 40px; height: 40px;"><i style="font-style:normal">×</i></button>
  </div>
  <div class="lbl-row" style="margin-top: 12px; display:flex; flex-wrap: wrap; gap: 16px;">
    <span class="lbl role-caption">default</span><span class="lbl role-caption">cta</span><span class="lbl role-caption">secondary</span><span class="lbl role-caption">ghost</span><span class="lbl role-caption">icon</span>
  </div>
</div>
</body>
</html>
