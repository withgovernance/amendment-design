<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Color — Semantic" subtitle="Success / warning / danger — conventional only" viewport="700x180" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Amendment specimen</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<!-- chrome comes from _card.css -->
</head>
<body>
<div class="card">
  <div style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px;">
    
  <div style="display: flex; flex-direction: column; gap: 6px; align-items: stretch;">
    <div style="background: #047857; height: 56px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 8%);"></div>
    <div style="font-family: var(--font-sans); font-variation-settings: var(--sans-chrome); text-transform: uppercase; font-size: 12px; letter-spacing: var(--track-chrome); color: var(--text-secondary); font-weight: var(--sans-semibold);">Success</div>
    <div style="font-family: var(--font-mono); font-size: 12px; color: var(--text-tertiary);">#047857</div>
  </div>
    
  <div style="display: flex; flex-direction: column; gap: 6px; align-items: stretch;">
    <div style="background: #10b981; height: 56px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 8%);"></div>
    <div style="font-family: var(--font-sans); font-variation-settings: var(--sans-chrome); text-transform: uppercase; font-size: 12px; letter-spacing: var(--track-chrome); color: var(--text-secondary); font-weight: var(--sans-semibold);">Success soft</div>
    <div style="font-family: var(--font-mono); font-size: 12px; color: var(--text-tertiary);">#10b981</div>
  </div>
    
  <div style="display: flex; flex-direction: column; gap: 6px; align-items: stretch;">
    <div style="background: #b45309; height: 56px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 8%);"></div>
    <div style="font-family: var(--font-sans); font-variation-settings: var(--sans-chrome); text-transform: uppercase; font-size: 12px; letter-spacing: var(--track-chrome); color: var(--text-secondary); font-weight: var(--sans-semibold);">Warning</div>
    <div style="font-family: var(--font-mono); font-size: 12px; color: var(--text-tertiary);">#b45309</div>
  </div>
    
  <div style="display: flex; flex-direction: column; gap: 6px; align-items: stretch;">
    <div style="background: #f59e0b; height: 56px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 8%);"></div>
    <div style="font-family: var(--font-sans); font-variation-settings: var(--sans-chrome); text-transform: uppercase; font-size: 12px; letter-spacing: var(--track-chrome); color: var(--text-secondary); font-weight: var(--sans-semibold);">Warning soft</div>
    <div style="font-family: var(--font-mono); font-size: 12px; color: var(--text-tertiary);">#f59e0b</div>
  </div>
    
  <div style="display: flex; flex-direction: column; gap: 6px; align-items: stretch;">
    <div style="background: #dc2626; height: 56px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 8%);"></div>
    <div style="font-family: var(--font-sans); font-variation-settings: var(--sans-chrome); text-transform: uppercase; font-size: 12px; letter-spacing: var(--track-chrome); color: var(--text-secondary); font-weight: var(--sans-semibold);">Danger</div>
    <div style="font-family: var(--font-mono); font-size: 12px; color: var(--text-tertiary);">#dc2626</div>
  </div>
    
  <div style="display: flex; flex-direction: column; gap: 6px; align-items: stretch;">
    <div style="background: #ef4444; height: 56px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 8%);"></div>
    <div style="font-family: var(--font-sans); font-variation-settings: var(--sans-chrome); text-transform: uppercase; font-size: 12px; letter-spacing: var(--track-chrome); color: var(--text-secondary); font-weight: var(--sans-semibold);">Danger soft</div>
    <div style="font-family: var(--font-mono); font-size: 12px; color: var(--text-tertiary);">#ef4444</div>
  </div>
  </div>
  <div style="margin-top: 12px; font-family: var(--font-serif); font-variation-settings: 'opsz' 16, 'wght' 420; font-size: 13px; color: var(--text-secondary);">Conventional only — never pressed into brand service.</div>
</div>
</body>
</html>
