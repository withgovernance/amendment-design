<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amendment — Business Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  :root {
    /* Card geometry — US standard 3.5in x 2in (1.75:1), designed at 2x */
    --card-w: 700px;
    --card-h: 400px;
    --parchment: oklch(0.962 0.014 83);
    --parchment-edge: oklch(0.93 0.018 80);
    --ink-deep: #0b1220;
    --seal-cream: #fdf6e3;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse 120% 90% at 50% -10%, #20242b, transparent 60%),
      #15171c;
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-variation-settings: var(--sans-body);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 56px;
    padding: 80px 40px 96px;
  }

  /* faint paper texture on the dark presentation backdrop */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      radial-gradient(circle at 18% 28%, rgb(255 255 255 / 0.018), transparent 40%),
      radial-gradient(circle at 82% 72%, rgb(255 255 255 / 0.015), transparent 42%);
    pointer-events: none;
  }

  .stage {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    gap: 64px;
    align-items: flex-start;
    justify-content: center;
  }

  .card-slot { display: flex; flex-direction: column; align-items: center; gap: 18px; }

  .side-label {
    font-family: var(--font-sans);
    font-variation-settings: var(--sans-chrome);
    font-weight: var(--sans-semibold);
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgb(255 255 255 / 0.42);
  }

  /* ---- the physical card ---- */
  .card {
    position: relative;
    width: var(--card-w);
    height: var(--card-h);
    border-radius: 14px;
    overflow: hidden;
    box-shadow:
      0 1px 0 0 rgb(255 255 255 / 0.04) inset,
      0 28px 50px -18px rgb(0 0 0 / 0.62),
      0 10px 20px -12px rgb(0 0 0 / 0.5);
    isolation: isolate;
  }

  /* ============================ MARK SIDE ============================ */
  .mark-side {
    background:
      radial-gradient(ellipse 86% 70% at 50% 30%, #233044 0%, #16203200 62%),
      linear-gradient(160deg, #1b2436 0%, #131a29 52%, #0c1220 100%);
    color: rgb(255 255 255 / 0.92);
  }
  /* breathing aurora */
  .mark-side .aurora {
    position: absolute; inset: -10%;
    background:
      radial-gradient(ellipse 60% 48% at 18% 14%, oklch(0.55 0.10 255 / 0.45), transparent 70%),
      radial-gradient(ellipse 54% 44% at 86% 22%, oklch(0.50 0.08 280 / 0.40), transparent 70%),
      radial-gradient(ellipse 64% 52% at 60% 96%, oklch(0.62 0.05 60 / 0.30), transparent 72%);
    filter: saturate(1.05);
    animation: breathe 14s var(--ease-standard) infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.78; transform: scale(1); }
    50%      { opacity: 1;    transform: scale(1.05); }
  }
  @media (prefers-reduced-motion: reduce) {
    .mark-side .aurora { animation: none; opacity: 0.9; }
  }

  .mark-inner {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 54px 40px;
    text-align: center;
  }

  .wax-seal {
    width: 96px; height: 96px;
    flex: none;
    filter: drop-shadow(0 6px 12px rgb(0 0 0 / 0.42));
  }

  .lockup { display: flex; flex-direction: column; align-items: center; gap: 14px; }

  .wordmark {
    font-family: var(--font-sans);
    font-variation-settings: "HEXP" 84;
    font-weight: 500;
    font-size: 40px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--seal-cream);
    line-height: 1;
    padding-left: 0.13em; /* optical center vs tracking */
  }
  .wordmark .dot { color: #c5563f; }

  .rule {
    width: 56px; height: 1px;
    background: rgb(253 246 227 / 0.32);
  }

  .tagline {
    font-family: var(--font-serif);
    font-style: italic;
    font-weight: 400;
    font-size: 14px;
    line-height: 1.45;
    color: rgb(253 246 227 / 0.6);
    max-width: 360px;
    text-wrap: balance;
  }

  /* ============================ INFO SIDE ============================ */
  .info-side {
    background:
      linear-gradient(180deg, var(--parchment) 0%, var(--parchment-edge) 100%);
    color: var(--text-primary);
  }
  /* faint ruled-paper grain */
  .info-side .grain {
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(
      0deg, transparent, transparent 27px,
      rgb(11 18 32 / 0.025) 27px, rgb(11 18 32 / 0.025) 28px);
    pointer-events: none; z-index: 0;
  }
  .info-inner {
    position: relative; z-index: 2;
    height: 100%;
    padding: 52px 54px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .info-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  .info-wordmark {
    font-family: var(--font-sans);
    font-variation-settings: "wdth" 120;
    font-weight: 500;
    font-size: 19px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #1b2436;
    line-height: 1;
  }
  .info-wordmark .dot { color: var(--color-action); }

  .seal-sm { width: 40px; height: 40px; flex: none; opacity: 0.96; filter: drop-shadow(0 2px 4px rgb(11 18 32 / 0.22)); }

  .identity { display: flex; flex-direction: column; gap: 8px; }
  .name {
    font-family: var(--font-serif);
    font-weight: 800;
    font-size: 34px;
    line-height: 1.04;
    letter-spacing: -0.012em;
    color: #14181f;
  }
  .role {
    font-family: var(--font-sans);
    font-variation-settings: var(--sans-chrome);
    font-weight: var(--sans-semibold);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--color-action);
  }

  .contact { display: flex; flex-direction: column; gap: 9px; }
  .contact .row {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--font-mono);
    font-size: 13.5px;
    font-weight: 400;
    letter-spacing: 0.01em;
    color: rgb(11 18 32 / 0.82);
  }
  .contact .row i {
    font-size: 15px;
    color: var(--color-action);
    width: 18px;
    text-align: center;
  }
  .contact .row a { color: inherit; text-decoration: none; }

  /* ---- guilloche bands (procedural, lightweight) ---- */
  .guilloche {
    position: absolute;
    left: 0; right: 0;
    height: 30px;
    z-index: 1;
    pointer-events: none;
    opacity: 0.9;
  }
  .guilloche.top { top: 0; }
  .guilloche.bottom { bottom: 0; transform: scaleY(-1); }
  .guilloche svg { width: 100%; height: 100%; display: block; }

  /* hide accents toggled off */
  .no-guilloche .guilloche { display: none; }
  .no-aurora .mark-side .aurora { display: none; }

  /* ---- footer note under the stage ---- */
  .stage-note {
    position: relative;
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 13px;
    color: rgb(255 255 255 / 0.4);
    text-align: center;
    max-width: 520px;
    line-height: 1.5;
  }

  @media (max-width: 860px) {
    body { padding: 40px 16px 64px; }
    .stage { gap: 40px; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <!-- ===================== MARK SIDE ===================== -->
    <div class="card-slot">
      <div class="side-label">Mark side</div>
      <div class="card mark-side" id="markCard">
        <div class="aurora"></div>

        <div class="guilloche top" data-guilloche="dark"></div>
        <div class="guilloche bottom" data-guilloche="dark"></div>

        <div class="mark-inner">
          <svg class="wax-seal" id="waxSeal" viewBox="0 0 120 120" role="img" aria-label="Amendment wax-seal monogram">
            <defs>
              <radialGradient id="seal-grad" cx="50%" cy="38%" r="58%">
                <stop offset="0%" stop-color="#a11f1f"></stop>
                <stop offset="58%" stop-color="#7f1d1d"></stop>
                <stop offset="100%" stop-color="#3f0a0a"></stop>
              </radialGradient>
            </defs>
            <circle cx="60" cy="60" r="54" fill="url(#seal-grad)"></circle>
            <circle cx="60" cy="60" r="54" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="1.5"></circle>
            <circle cx="60" cy="60" r="47" fill="none" stroke="#fdf6e3" stroke-opacity="0.24" stroke-width="1"></circle>
            <text x="60" y="80" text-anchor="middle" font-family="Merriweather, Georgia, serif" font-weight="800" font-size="60" fill="#fdf6e3" opacity="0.95">A</text>
          </svg>

          <div class="lockup">
            <div class="wordmark" id="wordmark">Amendment<span class="dot">.</span></div>
            <div class="rule"></div>
            <div class="tagline" id="tagline">The rule of law is a living document — and the people are its authors.</div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===================== INFO SIDE ===================== -->
    <div class="card-slot">
      <div class="side-label">Info side</div>
      <div class="card info-side" id="infoCard">
        <div class="grain"></div>

        <div class="guilloche top" data-guilloche="light"></div>
        <div class="guilloche bottom" data-guilloche="light"></div>

        <div class="info-inner">
          <div class="info-top">
            <div class="info-wordmark">Amendment<span class="dot">.</span></div>
            <svg class="seal-sm" viewBox="0 0 120 120" role="img" aria-label="Amendment seal">
              <defs>
                <radialGradient id="seal-grad-sm" cx="50%" cy="38%" r="58%">
                  <stop offset="0%" stop-color="#a11f1f"></stop>
                  <stop offset="58%" stop-color="#7f1d1d"></stop>
                  <stop offset="100%" stop-color="#3f0a0a"></stop>
                </radialGradient>
              </defs>
              <circle cx="60" cy="60" r="54" fill="url(#seal-grad-sm)"></circle>
              <circle cx="60" cy="60" r="47" fill="none" stroke="#fdf6e3" stroke-opacity="0.26" stroke-width="1.4"></circle>
              <text x="60" y="80" text-anchor="middle" font-family="Merriweather, Georgia, serif" font-weight="800" font-size="60" fill="#fdf6e3" opacity="0.95">A</text>
            </svg>
          </div>

          <div class="identity">
            <div class="name" id="name">Jason Putorti</div>
            <div class="role" id="role">Founder</div>
          </div>

          <div class="contact">
            <div class="row"><i class="ph ph-envelope-simple"></i><a href="mailto:jason@amendment.app">jason@amendment.app</a></div>
            <div class="row"><i class="ph ph-phone"></i><a href="tel:+14086212094">408.621.2094</a></div>
            <div class="row"><i class="ph ph-globe-simple"></i><a href="https://amendment.app">amendment.app</a></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="stage-note" id="note">Front &amp; back · 3.5″ × 2″ standard card · printed clean with guilloche edge bands</div>

  <!-- ===================== Tweaks ===================== -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <script>
    /* ---- procedural guilloche bands (banknote / diploma line-work) ---- */
    function buildGuilloche(host) {
      const dark = host.dataset.guilloche === "dark";
      const W = 700, H = 30;
      const stroke = dark ? "#fdf6e3" : "#334155";
      const op = dark ? 0.30 : 0.34;
      const lines = 16;
      let paths = "";
      for (let i = 0; i < lines; i++) {
        const phase = (i / lines) * Math.PI * 2;
        const amp = 4 + (i % 3) * 1.6;
        const yMid = H / 2 + (i - lines / 2) * 0.5;
        const freq = 0.045 + (i % 2) * 0.012;
        let d = "M 0 " + (yMid + amp * Math.sin(phase)).toFixed(2);
        for (let x = 4; x <= W; x += 4) {
          const y = yMid + amp * Math.sin(x * freq + phase) + (amp * 0.4) * Math.sin(x * freq * 2.3 + phase * 1.7);
          d += " L " + x + " " + y.toFixed(2);
        }
        const o = (op * (0.5 + 0.5 * (1 - Math.abs(i - lines / 2) / (lines / 2)))).toFixed(3);
        paths += '<path d="' + d + '" fill="none" stroke="' + stroke + '" stroke-opacity="' + o + '" stroke-width="0.6"/>';
      }
      host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' + paths + '</svg>';
    }
    document.querySelectorAll('.guilloche').forEach(buildGuilloche);
  </script>

  <script type="text/babel">
    const { useTweaks, TweaksPanel, TweakSection, TweakRadio, TweakToggle, TweakText } = window;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "markBg": "dark",
      "lockup": "seal + wordmark",
      "guilloche": true,
      "aurora": true,
      "role": "Founder",
      "tagline": "The rule of law is a living document — and the people are its authors."
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

      React.useEffect(() => {
        const stage = document.getElementById('stage');
        const markCard = document.getElementById('markCard');
        const seal = document.getElementById('waxSeal');
        const wordmark = document.getElementById('wordmark');

        // accents
        stage.classList.toggle('no-guilloche', !t.guilloche);
        stage.classList.toggle('no-aurora', !t.aurora);

        // lockup variant
        const showSeal = t.lockup !== 'wordmark only';
        const showWord = t.lockup !== 'seal only';
        seal.style.display = showSeal ? '' : 'none';
        wordmark.parentElement.style.display = showWord ? '' : 'none';
        // when seal-only, enlarge the seal a touch
        seal.style.width = seal.style.height = (t.lockup === 'seal only') ? '128px' : '96px';

        // mark side background light/dark
        if (t.markBg === 'light') {
          markCard.classList.remove('mark-side');
          markCard.classList.add('info-side');
          markCard.style.color = 'var(--text-primary)';
          wordmark.style.color = '#1b2436';
          document.getElementById('tagline').style.color = 'rgb(11 18 32 / 0.6)';
          markCard.querySelector('.rule').style.background = 'rgb(11 18 32 / 0.18)';
          markCard.querySelectorAll('.guilloche').forEach(g => { g.dataset.guilloche = 'light'; buildGuilloche(g); });
        } else {
          markCard.classList.add('mark-side');
          markCard.classList.remove('info-side');
          markCard.style.color = '';
          wordmark.style.color = 'var(--seal-cream)';
          document.getElementById('tagline').style.color = 'rgb(253 246 227 / 0.6)';
          markCard.querySelector('.rule').style.background = 'rgb(253 246 227 / 0.32)';
          markCard.querySelectorAll('.guilloche').forEach(g => { g.dataset.guilloche = 'dark'; buildGuilloche(g); });
        }

        // text content
        document.getElementById('role').textContent = t.role;
        document.getElementById('tagline').textContent = t.tagline;
      }, [t]);

      return (
        <TweaksPanel>
          <TweakSection label="Mark side" />
          <TweakRadio label="Background" value={t.markBg} options={['dark', 'light']}
            onChange={(v) => setTweak('markBg', v)} />
          <TweakRadio label="Lockup" value={t.lockup}
            options={['seal + wordmark', 'wordmark only', 'seal only']}
            onChange={(v) => setTweak('lockup', v)} />
          <TweakText label="Tagline" value={t.tagline}
            onChange={(v) => setTweak('tagline', v)} />

          <TweakSection label="Accents" />
          <TweakToggle label="Guilloche bands" value={t.guilloche}
            onChange={(v) => setTweak('guilloche', v)} />
          <TweakToggle label="Breathing aurora" value={t.aurora}
            onChange={(v) => setTweak('aurora', v)} />

          <TweakSection label="Info side" />
          <TweakText label="Role" value={t.role}
            onChange={(v) => setTweak('role', v)} />
        </TweaksPanel>
      );
    }

    const host = document.createElement('div');
    document.body.appendChild(host);
    ReactDOM.createRoot(host).render(<App />);
  </script>
</body>
</html>
