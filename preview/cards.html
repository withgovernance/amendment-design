<!DOCTYPE html>
<!-- @dsCard group="Components" name="Components — Cards" subtitle="material-thin · material-regular · card-empty" viewport="700x119" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Amendment specimen</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>.card { padding: 14px 24px; }
  
</style>
</head>
<body>
<div class="card">
  <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
    <div style="background: rgb(255 255 255 / 45%); backdrop-filter: blur(50px); padding: 14px; border-radius: 8px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 5%);">
      <div class="lbl" style="margin-bottom: 6px;">material-thin</div>
      <div style="font-family: var(--font-serif); font-variation-settings: var(--serif-display); font-weight: 700; font-size: 14px;">HB 21</div>
      <div style="font-family: var(--font-serif); font-variation-settings: 'opsz' 16, 'wght' 420; font-size: 12px; color: var(--text-secondary); margin-top: 2px;">Cards float on aurora</div>
    </div>
    <div style="background: rgb(255 255 255 / 85%); backdrop-filter: blur(50px); padding: 14px; border-radius: 8px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 10%), 0 4px 6px -1px rgb(15 23 42 / 0.12), 0 2px 4px -2px rgb(15 23 42 / 0.12);">
      <div class="lbl" style="margin-bottom: 6px;">material-regular</div>
      <div style="font-family: var(--font-serif); font-variation-settings: var(--serif-display); font-weight: 700; font-size: 14px;">Primary content</div>
      <div style="font-family: var(--font-serif); font-variation-settings: 'opsz' 16, 'wght' 420; font-size: 12px; color: var(--text-secondary); margin-top: 2px;">+ raised shadow</div>
    </div>
    <div style="background: transparent; border: 2px dashed rgb(0 0 0 / 30%); padding: 14px; border-radius: 8px; text-align:center;">
      <div class="lbl" style="margin-bottom: 6px;">card-empty</div>
      <div style="font-family: var(--font-serif); font-variation-settings: 'opsz' 16, 'wght' 420; font-size: 12px; color: var(--text-tertiary);">No bills tracked yet</div>
    </div>
  </div>
</div>
</body>
</html>
