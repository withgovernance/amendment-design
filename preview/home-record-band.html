<!DOCTYPE html>
<!-- @dsCard group="Surfaces" name="Surfaces — Home: the record band" subtitle="A real race, its top ask and its answers · ribbon on an ask's journey · card-placeholder for an unanswered slot · show the zero (A) or hide it (B)" viewport="1440x900" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amendment specimen — home record band</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* A page-width specimen, not a card: the band is rendered at the width the home
   page gives it, so 390 and 1440 are real layouts. ?v=a|b picks the reading;
   ?dark sets the scheme on the shell (dark is class-based). Data is a prod read,
   frozen below with its time; the build binds every number live. */
html, body { margin: 0; }
body { min-height: 100vh; }
.band { box-sizing: border-box; max-width: var(--container-wide); margin: 0 auto; padding: var(--space-16) var(--space-4); display: grid; gap: var(--space-8); }
@media (min-width: 64rem) { .band { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--space-16); padding: var(--space-16) var(--space-8); align-items: start; } }
.intro h2 { margin: 0 0 var(--space-4); }
.intro p { margin: 0; color: var(--text-secondary); max-width: 28rem; }
.intro .src { margin-top: var(--space-6); }
.reach { margin-top: var(--space-8); padding-top: var(--space-4); border-top: 1px solid var(--border-subtle); max-width: 28rem; }
.reach .role-stat-display { display: block; }
.reach .role-body { margin: var(--space-1) 0 0; color: var(--text-secondary); }

/* components.card: material-regular, --card-pad stepping with the card's own width */
.record { container: record / inline-size; border-radius: var(--radius-md); overflow: hidden; }
.record { --card-pad: var(--space-4); }
@container record (min-width: 24rem) { .inner, .foot { --card-pad: var(--space-5); } }
.inner { padding: var(--card-pad); display: flex; flex-direction: column; gap: 16px; }
.eyebrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: var(--line-box-metadata-sans); }
.title { margin: 0; }
.title a { color: inherit; text-decoration: none; position: relative; }
/* a.targetSize: the title is a link with its own line box — a 44px hit area, never padding */
.title a::after { content: ""; position: absolute; left: 0; right: 0; top: -12px; bottom: -12px; }
.title a:hover { text-decoration: underline; text-underline-offset: 2px; }
.count { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.count .n { color: var(--ink-success); }
.count .of { color: var(--text-secondary); }

/* progress-ribbon, the same tokens and below-width switch as preview/progress-ribbon.html */
.ribbon { container: ribbon / inline-size; }
.bar, .labels { display: flex; gap: 1px; }
.bar { height: 8px; margin-bottom: 8px; }
.bar > div { flex: 1; border-radius: 9999px; background: var(--ribbon-track); }
.bar > .completed { background: var(--ribbon-completed); }
.bar > .active { background: var(--ribbon-active); }
.labels > div { flex: 1; text-align: center; color: var(--text-secondary); white-space: nowrap; }
.labels > .current { color: var(--text-primary); font-weight: var(--sans-semibold); }
.labels .when { display: block; font-weight: var(--sans-normal); color: var(--text-secondary); }
.narrow { display: none; text-align: center; }
.narrow .step { color: var(--text-primary); font-weight: var(--sans-semibold); }
@container ribbon (width < 38rem) { .labels { display: none; } .narrow { display: block; } }

/* the race: a list of rows inside the card, divided by the hairline */
.race-head { display: block; }
.people { list-style: none; margin: 0; padding: 0; }
.people li { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 12px; padding: 12px 0; border-top: 1px solid var(--border-subtle); }
.people li:last-child { border-bottom: 1px solid var(--border-subtle); }
.people .name { font-weight: var(--sans-semibold); }
.people .meta { color: var(--text-secondary); }
@container record (width < 30rem) { .people li { flex-direction: column; } }

/* card-placeholder: a slot someone can fill — 16px inside a dense list. No title:
   the ribbon above already names the state (card-placeholder.the-container-names-the-state) */
.slot { border: 2px dashed var(--border-dashed-empty); border-radius: 0.5rem; padding: 16px; text-align: center; }
.slot .role-body { margin: 0; color: var(--text-secondary); }

/* the docked foot under a full-width hairline: one report line, the card's act */
.foot { padding: var(--card-pad); border-top: 1px solid var(--border-subtle); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; }
.foot .report { color: var(--text-secondary); }
.foot .acts { display: flex; align-items: center; gap: 20px; }
.foot .role-action { min-height: 48px; }
.foot a.more { color: var(--text-primary); min-height: 44px; display: inline-flex; align-items: center; text-underline-offset: 2px; }

.variant { position: fixed; top: 8px; right: 8px; z-index: 5; }
</style>
</head>
<body class="amendment-app">
<span class="variant role-label-caps" id="vlabel"></span>
<section class="band">
  <div class="intro">
    <h2 class="role-display-section">A petition ends when it’s delivered. An ask keeps going.</h2>
    <p class="role-body-lead" id="lead"></p>
    <div class="reach"><span class="role-stat-display" id="camps"></span><p class="role-body" id="campsl"></p></div>
    <p class="src role-caption" id="src"></p>
  </div>
  <article class="record material-regular">
    <div class="inner">
      <div class="eyebrow"><span class="role-designation" id="code"></span><span class="role-metadata-sans" id="office"></span></div>
      <h3 class="title role-ui-heading"><a href="#" id="ask"></a></h3>
      <div class="count"><span class="role-stat-card n" id="dn"></span><span class="role-metadata-sans" id="dl"></span><span class="role-metadata-sans of" id="nat"></span></div>
      <div class="ribbon">
        <div class="bar" id="bar"></div>
        <div class="labels" id="labels"></div>
        <div class="narrow"><div class="role-metadata-sans step" id="nstep"></div><div class="role-metadata-sans" id="nwhen"></div></div>
      </div>
      <div>
        <span class="race-head role-label-caps" style="margin-bottom:8px">On the ballot</span>
        <ul class="people" id="people"></ul>
      </div>
      <div class="slot" id="slot"><p class="role-body" id="slotmsg"></p></div>
    </div>
    <div class="foot">
      <span class="report role-metadata-sans" id="report"></span>
      <span class="acts"><a class="more role-body" href="#">See this race</a><button class="role-action">Co-sign</button></span>
    </div>
  </article>
</section>
<script>
const D = window.__DATA__ = {
  readAt: "", code: "", office: "", district: "", ask: "", districtCount: 0, nationwide: 0,
  threshold: 0, deliveredAt: "", candidates: [], cosignsAll: 0
};
</script>
<script src="home-record-band.data.js"></script>
<script>
const q = new URLSearchParams(location.search), v = (q.get('v') || 'a').toLowerCase();
if (q.has('dark')) document.documentElement.classList.add('dark');
const D2 = window.__DATA__, fmt = n => n.toLocaleString('en-US'), $ = id => document.getElementById(id);
$('vlabel').textContent = v === 'a' ? 'A · show the zero' : 'B · hide the zero';
$('lead').textContent = 'Every co-sign is counted in a real district. When enough co-signers in a district sign, the ask is delivered to the campaigns in that race, and it stays on the record past Election Day.';
$('src').textContent = 'Prod read ' + D2.readAt + '. The build binds every number live.';
$('camps').textContent = fmt(D2.campaigns);
$('campsl').textContent = 'campaigns in ' + fmt(D2.races) + ' races have received this ask.';
$('code').textContent = D2.code; $('office').textContent = D2.office;
$('ask').textContent = D2.ask;
$('dn').textContent = fmt(D2.districtCount); $('dl').textContent = 'co-signs in ' + D2.code;
$('nat').textContent = '· ' + fmt(D2.nationwide) + ' nationwide';
const delivered = !!D2.deliveredAt;
const steps = [['Co-signed', 'completed', ''], ['Delivered', delivered ? 'completed' : 'active', delivered ? D2.deliveredAt : fmt(D2.districtCount) + ' of ' + fmt(D2.threshold)],
  ['Answered', '', ''], ['Backed', '', ''], ['In office', '', '']];
if (v === 'a' && delivered) steps[2] = ['Answered', 'active', 'Waiting on ' + D2.candidates.length];
if (v === 'b' && delivered) steps[1][1] = 'active';
const cur = steps.find(s => s[1] === 'active');
$('bar').innerHTML = steps.map(s => '<div class="' + s[1] + '"></div>').join('');
$('labels').innerHTML = steps.map(s => '<div class="role-metadata-sans' + (s[1] === 'active' ? ' current' : '') + '">' + s[0] + (s[1] === 'active' && s[2] ? '<span class="when">' + s[2] + '</span>' : '') + '</div>').join('');
$('nstep').textContent = cur[0]; $('nwhen').textContent = cur[2];
$('people').innerHTML = D2.candidates.map(c => '<li><span class="role-body name">' + c.name + '</span><span class="role-metadata-sans meta">' + [c.party, c.incumbent ? 'Incumbent' : ''].filter(Boolean).join(' · ') + '</span></li>').join('');
if (v === 'a') $('slotmsg').textContent = 'Any candidate in this race can answer on the record. Answers appear here, dated.';
else $('slot').remove();
$('report').textContent = delivered ? 'Delivered to the campaigns in ' + D2.code : fmt(D2.threshold - D2.districtCount) + ' more in ' + D2.code + ' to deliver';
</script>
</body>
</html>
