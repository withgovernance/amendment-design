<!DOCTYPE html>
<!-- @dsCard group="Components" name="Components — Inputs" subtitle="chrome-width labels · inset slate focus ring" viewport="700x179" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Amendment specimen</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<!-- chrome comes from _card.css -->
</head>
<body>
<div class="card">
  <div style="display: grid; gap: 12px; max-width: 460px;">
    <div>
      <div style="font-family: var(--font-sans); font-variation-settings: var(--sans-chrome); text-transform: uppercase; font-size: 12px; font-weight: var(--sans-semibold); letter-spacing: var(--track-chrome); color: var(--text-secondary); margin-bottom: 6px;">Your representative</div>
      <input style="width: 100%; background: rgb(0 0 0 / 5%); border: 0; box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.05), inset 0 0 0 1px rgb(0 0 0 / 10%); border-radius: 4px; padding: 9px 12px; font-family: var(--font-sans); font-size: 14px; color: var(--text-primary); box-sizing: border-box;" placeholder="Senator Jane Doe" value="">
    </div>
    <div>
      <div style="font-family: var(--font-sans); font-variation-settings: var(--sans-chrome); text-transform: uppercase; font-size: 12px; font-weight: var(--sans-semibold); letter-spacing: var(--track-chrome); color: var(--text-secondary); margin-bottom: 6px;">Subject</div>
      <input style="width: 100%; background: rgb(0 0 0 / 5%); border: 0; box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.05), inset 0 0 0 2px var(--color-functional); border-radius: 4px; padding: 9px 12px; font-family: var(--font-sans); font-size: 14px; color: var(--text-primary); box-sizing: border-box;" value="On HB 21 — district housing">
    </div>
  </div>
</div>
</body>
</html>
