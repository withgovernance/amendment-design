<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Color — Ink on paper" subtitle="Text opacity 87 / 55 / 38 on black + white (Apple HIG)" viewport="700x230" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Amendment color specimen</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>.card { padding: 16px 22px; min-height: 210px; }.caption { font-variation-settings: 'opsz' 16, 'wght' 420; }
  .swatch-label { font-family: var(--font-sans); font-variation-settings: var(--sans-chrome); text-transform: uppercase; font-size: 12px; letter-spacing: var(--track-chrome); color: var(--text-secondary); font-weight: var(--sans-semibold); }
  .hex { font-family: var(--font-mono); font-size: 12px; color: var(--text-tertiary); }
  
</style>
</head>
<body>
<div class="card">
  <div class="voice-eyebrow">Ink on paper · text opacity</div>
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 6px;">
    <div style="background: #ffffff; padding: 16px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 8%);">
      <div style="color: rgb(0 0 0 / 87%); font-weight: var(--sans-medium); font-size: 16px;">Primary · 87%</div>
      <div style="color: rgb(0 0 0 / 55%); font-weight: var(--sans-normal); font-size: 14px; margin-top: 4px;">Secondary · 55%</div>
      <div style="color: rgb(0 0 0 / 38%); font-weight: var(--sans-normal); font-size: 12px; margin-top: 4px;">Tertiary · 38%</div>
    </div>
    <div style="background: #18181b; padding: 16px; border-radius: 6px;">
      <div style="color: rgb(255 255 255 / 87%); font-weight: 317; font-size: 16px;">Primary · 87%</div>
      <div style="color: rgb(255 255 255 / 55%); font-weight: 258; font-size: 14px; margin-top: 4px;">Secondary · 55%</div>
      <div style="color: rgb(255 255 255 / 38%); font-weight: 258; font-size: 12px; margin-top: 4px;">Tertiary · 38%</div>
    </div>
  </div>
  <div class="caption" style="margin-top: 10px;">Apple-HIG three-rung opacity on black and white. Works only because the aurora is monochromatic and low-chroma — broaden the aurora and the invariant breaks.</div>
</div>
</body>
</html>
