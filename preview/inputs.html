<!DOCTYPE html>
<!-- @dsCard group="Components" name="Components — Inputs" subtitle="The 44px target is declared, not reached · chrome-width labels · inset focus ring" viewport="700x235" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Amendment specimen</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
/* CONFORMANCE 2026-09-03. This card shipped 9px padding on 14px text and no
   declared height, so its fields measured whatever the type size made them —
   which is the exact arithmetic components.input.touchTarget was written to
   correct ("8px padding on 16px text at 1.5 is 40px"). A specimen that
   demonstrates a rule by breaking it is the trap the shared chrome exists to
   close. The recess is unchanged: the height goes to the field box, not to
   the inset shadow or the 1px ring. */
.f {
  display: block; width: 100%; box-sizing: border-box;
  min-height: 44px;
  padding: 8px 12px;
  background: rgb(0 0 0 / 5%);
  border: 0;
  border-radius: var(--radius-sm);
  box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.05), inset 0 0 0 1px var(--border-subtle);
  font-family: var(--font-sans); font-variation-settings: var(--sans-body);
  font-size: 16px; line-height: 1.5; color: var(--text-primary);
}
.dark .f { background: rgb(255 255 255 / 6%); }
.f::placeholder { color: var(--text-tertiary); }
/* The focus state is the global :focus-visible rule; drawn statically so it
   survives a still. --focus-color, not a slate literal. */
.f.is-focus { box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.05), inset 0 0 0 2px var(--focus-color); }
.row { margin-bottom: 12px; }
.row > .role-label-caps { display: block; margin-bottom: 6px; }
</style>
</head>
<body>
<div class="card">
  <div style="max-width: 460px;">
    <div class="row">
      <span class="role-label-caps">Your representative</span>
      <input class="f" placeholder="Sen. Jane Doe">
    </div>
    <div class="row">
      <span class="role-label-caps">Subject</span>
      <input class="f is-focus" value="On HB 21 — district housing">
    </div>
    <p class="caption" style="margin:0;">44px is declared. It is not padding — appearance and target are two geometries, and this field's appearance did not change.</p>
  </div>
</div>
</body>
</html>
