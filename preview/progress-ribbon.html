<!DOCTYPE html>
<!-- @dsCard group="Components" name="Components — Progress ribbon" subtitle="Bill journey · 8px segmented · sentence-case labels" viewport="700x140" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Amendment specimen</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>.card { padding: 14px 24px; }
/* Below sm, five milestone labels cannot sit under five segments.
   Production (bill-status-progress-bar.tsx) replaces the row with one centred
   caption naming the active step — the same shape as the failure case. */
.cap-narrow { display: none; }
.ribbon-current { display: none; text-align: center; color: var(--text-primary); }
@media (max-width: 639.98px) {
  .ribbon-labels { display: none !important; }
  .ribbon-current { display: block; }
  .cap-wide { display: none; }
  .cap-narrow { display: inline; }
}
</style>
</head>
<body>
<div class="card">
  <div data-paper style="background: var(--paper-cream); border-radius: 4px; padding: 22px 24px; box-shadow: inset 0 0 0 1px var(--border-subtle);">
    <div style="display:flex; gap: 1px; height: 8px; margin-bottom: 10px;">
      <div style="flex:1; background: #334155; border-radius: 9999px;"></div>
      <div style="flex:1; background: #334155; border-radius: 9999px;"></div>
      <div style="flex:1; background: rgb(100 116 139 / 0.7); border-radius: 9999px;"></div>
      <div style="flex:1; background: rgb(148 163 184 / 0.2); border-radius: 9999px;"></div>
      <div style="flex:1; background: rgb(148 163 184 / 0.2); border-radius: 9999px;"></div>
    </div>
    <div class="ribbon-current role-caption">Engrossed</div>
    <div class="ribbon-labels" style="display:flex; gap:1px;">
      <div style="flex:1; text-align:center;" class="role-caption">Prefiled</div><div style="flex:1; text-align:center;" class="role-caption">Introduced</div><div style="flex:1; text-align:center;" class="role-caption">Engrossed</div><div style="flex:1; text-align:center;" class="role-caption">Enrolled</div><div style="flex:1; text-align:center;" class="role-caption">Enacted</div>
    </div>
  </div>
  <div style="margin-top: 8px; font-family: var(--font-serif); font-variation-settings: 'opsz' 16, 'wght' 420; font-size: 12px; color: var(--text-secondary);"><span class="cap-wide">8px segmented bar · sentence-case milestone labels (role-caption) · slate ink: completed, active, track</span><span class="cap-narrow">8px segmented bar · below sm only the active step’s label shows, as production does · slate ink: completed, active, track</span></div>
</div>
</body>
</html>
