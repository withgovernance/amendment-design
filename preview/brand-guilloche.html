<!DOCTYPE html>
<!-- @dsCard group="Components" name="Brand — Guilloche" subtitle="Receipt-surface line-work border (tactile accent)" viewport="700x234" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brand — Guilloche</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>.card { padding: 14px 24px; }
  .paper { background: var(--paper-cream); border-radius: 4px; padding: 4px; box-shadow: inset 0 0 0 1px var(--border-subtle); }
  .body { padding: 24px 28px; text-align: center; }.caption { margin-top: 10px; font-variation-settings: 'opsz' 16, 'wght' 420; }

</head>
<body>
<div class="card">
  <div class="paper">
    <img src="../assets/guilloche-band.svg" style="display: block; width: 100%; height: auto;" alt="Guilloche band"/>
    <div class="body">
      <div style="font-family: var(--font-serif); font-variation-settings: var(--serif-display); font-weight: 800; font-size: 22px; color: var(--text-primary);">Letter delivered</div>
      <div style="font-family: var(--font-serif); font-variation-settings: 'opsz' 16, 'wght' 420; font-size: 12px; color: var(--text-secondary); margin-top: 4px;">Issued · Receipt surfaces only</div>
    </div>
    <img src="../assets/guilloche-band.svg" style="display: block; width: 100%; height: auto; transform: scaleY(-1);" alt=""/>

</div>
