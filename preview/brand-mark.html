<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Brand — Mark" subtitle="The voting-button badge — primary and knockout" viewport="700x242" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brand — Mark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>.card { padding:28px; display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.pane{border-radius:6px;padding:22px;display:flex;align-items:center;gap:20px}
.pane.light{background:#f4f4f5;box-shadow:inset 0 0 0 1px rgb(0 0 0/.06)}
.pane.dark{background:#0f172a}
.pane img{width:88px;height:88px;flex:none}
.lab{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-variation-settings:var(--sans-chrome);line-height:1.5}
.pane.light .lab{color:rgb(0 0 0/.55)}
.pane.dark .lab{color:rgb(255 255 255/.62)}
.lab b{display:block;font-size:13px;letter-spacing:.04em;text-transform:none;font-variation-settings:var(--sans-body)}
.pane.light .lab b{color:var(--color-primary-dark)}
.pane.dark .lab b{color:#f7f3e8}
</style>
</head>
<body>
<div class="card">
  <div class="pane light"><img src="../assets/mark.svg" alt="Amendment mark"><div class="lab"><b>mark.svg</b>Primary · parchment ring, indigo field · light surfaces, app icon, favicon</div></div>
  <div class="pane dark"><img src="../assets/mark-cutout.svg" alt="Amendment mark, knockout"><div class="lab"><b>mark-cutout.svg</b>Knockout · white stroke, transparent field · indigo, photography, print</div></div>
</div>
</body>
</html>
