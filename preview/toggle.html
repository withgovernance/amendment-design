<!DOCTYPE html>
<!-- @dsCard group="Components" name="Components — Toggle" subtitle="Translate-only motion · never thumb-scale" viewport="700x99" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Amendment specimen</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<!-- chrome comes from _card.css -->
</head>
<body>
<div class="card">
  <div style="display:flex; gap: 28px; align-items: center;">
    <div style="display:flex; flex-direction: column; gap: 6px; align-items:center;">
      <div style="width: 44px; height: 24px; background: rgb(0 0 0 / 5%); border-radius: 9999px; padding: 4px; box-sizing: border-box; display:flex;">
        <div style="width: 16px; height: 16px; background: rgb(0 0 0 / 87%); border-radius: 9999px;"></div>
      </div>
      <span class="lbl">off</span>
    </div>
    <div style="display:flex; flex-direction: column; gap: 6px; align-items:center;">
      <div style="width: 44px; height: 24px; background: rgb(255 255 255 / 10%); backdrop-filter: blur(50px); border-radius: 9999px; padding: 4px; box-sizing: border-box; display:flex; justify-content: flex-end; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 10%);">
        <div style="width: 16px; height: 16px; background: rgb(0 0 0 / 87%); border-radius: 9999px;"></div>
      </div>
      <span class="lbl">on</span>
    </div>
    <div style="font-family: var(--font-serif); font-variation-settings: 'opsz' 16, 'wght' 420; font-size: 12px; color: var(--text-secondary); max-width: 280px;">Track slides by transform; press feedback is opacity-80 — never thumb-scale (violates no-transform).</div>
  </div>
</div>
</body>
</html>
