<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segmented dark plate</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 24px 16px; min-height: 100vh; box-sizing: border-box;
  background: var(--aurora), var(--canvas-live); color: var(--text-primary); font-family: var(--font-sans); }
.grid { display: flex; flex-wrap: wrap; gap: 28px; }
.cap { font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); margin: 0 0 8px; }
.seg { display: inline-grid; grid-template-columns: auto auto; padding: 4px;
  background: rgb(255 255 255 / 6%); border-radius: var(--radius-md);
  box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.05), inset 0 0 0 1px var(--border-subtle); }
.seg > button { min-height: 44px; padding: 0 16px; border: 0; background: transparent; border-radius: var(--radius-sm);
  font-family: var(--font-sans); font-variation-settings: var(--sans-body); font-size: 1rem;
  font-weight: var(--sans-normal); color: var(--text-secondary); }
.seg > button.is-sel { color: var(--text-primary); font-weight: var(--sans-semibold); }
.b .is-sel { background: color-mix(in srgb, var(--canvas-live) 86%, white); }
.c .is-sel { background: rgb(255 255 255 / 12%); }
.d .is-sel { background: rgb(255 255 255 / 10%); backdrop-filter: blur(50px); -webkit-backdrop-filter: blur(50px);
  box-shadow: inset 0 0 0 1px var(--border-subtle); }
.e .is-sel { background: rgb(255 255 255 / 16%); box-shadow: inset 0 0 0 1px var(--border-subtle); }
</style>
</head>
<body>
<div class="grid">
  <div><p class="cap">B · opaque canvas lift, 86% + white (rejected: a grey slab on the aurora)</p>
    <div class="seg b"><button class="is-sel">Monthly</button><button>Yearly · 2 months free</button></div></div>
  <div><p class="cap">C · white wash 12%, no ring</p>
    <div class="seg c"><button class="is-sel">Monthly</button><button>Yearly · 2 months free</button></div></div>
  <div><p class="cap">D · glass: white 10% + blur, one ring (material-ultrathin, light construction)</p>
    <div class="seg d"><button class="is-sel">Monthly</button><button>Yearly · 2 months free</button></div></div>
  <div><p class="cap">E · white wash 16% + one ring</p>
    <div class="seg e"><button class="is-sel">Monthly</button><button>Yearly · 2 months free</button></div></div>
</div>
</body>
</html>
