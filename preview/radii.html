<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing — Radii" subtitle="4 / 8 / 12 / full — inputs to pills" viewport="700x170" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Amendment specimen</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<!-- chrome comes from _card.css -->
</head>
<body>
<div class="card">
  <div style="display:flex; gap: 18px; align-items: flex-end;">
    
      <div style="display:flex; flex-direction:column; gap:6px; align-items:center;">
        <div style="background: var(--color-primary); width: 68px; height: 68px; border-radius: 4px;"></div>
        <span class="lbl">0.25rem</span>
        <span style="font-family: var(--font-serif); font-variation-settings: 'opsz' 16, 'wght' 420; font-size: 12px; color: var(--text-tertiary);">inputs, pills</span>
      </div>
    
      <div style="display:flex; flex-direction:column; gap:6px; align-items:center;">
        <div style="background: var(--color-primary); width: 68px; height: 68px; border-radius: 8px;"></div>
        <span class="lbl">0.5rem</span>
        <span style="font-family: var(--font-serif); font-variation-settings: 'opsz' 16, 'wght' 420; font-size: 12px; color: var(--text-tertiary);">buttons, cards</span>
      </div>
    
      <div style="display:flex; flex-direction:column; gap:6px; align-items:center;">
        <div style="background: var(--color-primary); width: 68px; height: 68px; border-radius: 12px;"></div>
        <span class="lbl">0.75rem</span>
        <span style="font-family: var(--font-serif); font-variation-settings: 'opsz' 16, 'wght' 420; font-size: 12px; color: var(--text-tertiary);">modals, FAB</span>
      </div>
    
      <div style="display:flex; flex-direction:column; gap:6px; align-items:center;">
        <div style="background: var(--color-primary); width: 68px; height: 68px; border-radius: 9999px;"></div>
        <span class="lbl">full</span>
        <span style="font-family: var(--font-serif); font-variation-settings: 'opsz' 16, 'wght' 420; font-size: 12px; color: var(--text-tertiary);">pills, avatars</span>
      </div>
    
  </div>
</div>
</body>
</html>
