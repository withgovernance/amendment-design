<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type — The institution speaks (UI chrome)" subtitle="Archivo body + chrome-width chrome — the scaffolding around content" viewport="700x194" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Amendment type specimen</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>.card { padding: 18px 24px; min-height: 180px; }.caption { font-variation-settings: 'opsz' 16, 'wght' 420; }
  
</style>
</head>
<body>
<div class="card">
  <div class="voice-eyebrow role-label-caps">The institution speaks</div>
  <div style="display: grid; gap: 14px; margin-top: 10px;">
    <div>
      <div class="role-body">Body — <code>role-body</code>. The default reading register.</div>
    </div>
    <div>
      <div class="role-label-caps">Bill text</div>
      <div class="role-caption" style="display:flex; align-items:center; gap:4px; margin-top:6px;">Conversations <i class="ph ph-caret-right" style="font-size:12px; color: var(--text-tertiary);"></i> Colorado <i class="ph ph-caret-right" style="font-size:12px; color: var(--text-tertiary);"></i> <span style="font-weight: var(--sans-semibold); color: var(--text-primary);">HB 21</span></div>
    </div>
    <div class="caption">Chrome labels (<code>role-label-caps</code>) take two sites only: the section divider, as above, and the status stamp. A breadcrumb is sentence case, <code>role-caption</code> (<code>typography.chrome-sites-are-closed</code>).</div>
  </div>
</div>
</body>
</html>
